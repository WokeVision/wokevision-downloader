<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0A0A0C" /><link rel="icon" href="/static/assets/logo-mark.png" />
<title>Bio link · WokeVision</title>
<link rel="stylesheet" href="/static/nav.css" />
<style>
  :root { color-scheme: dark; --bg:#0A0A0C; --surface:rgba(255,255,255,0.055); --border:rgba(255,255,255,0.10); --text:#F5F5F7; --faint:rgba(245,245,247,0.5); --accent:#FF2B3C; }
  * { box-sizing: border-box; } html, body { background: var(--bg); color: var(--text); margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding-bottom: 48px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 18px 0; } h1 { font-size: 26px; margin: 0 0 4px; } .sub { color: var(--faint); font-size: 13px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  input[type=text], select { width: 100%; background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font: inherit; font-size: 14.5px; margin-bottom: 10px; }
  label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 5px; }
  .btn { border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text); font: inherit; font-weight: 600; font-size: 13.5px; padding: 9px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.accent { background: var(--accent); border-color: transparent; } .btn.danger { color: #FFB4B4; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .stat { font-size: 12.5px; color: var(--faint); }
  .link { display: flex; gap: 10px; align-items: flex-start; } .link .body { flex: 1; min-width: 0; }
</style></head><body>
<script src="/static/nav.js"></script>
<div class="wrap">
  <h1>Bio link</h1>
  <div class="sub">Your public page: <a id="pub" href="/links" target="_blank" style="color:#ff6b78"></a> — put this in your Instagram bio. Every tap is counted.</div>
  <div class="card"><label>Page title</label><input type="text" id="title" placeholder="WokeVision" />
    <label>Handle</label><input type="text" id="handle" placeholder="@wokevision_" />
    <label>Short line under it</label><input type="text" id="text" placeholder="Sharp takes, daily." />
    <button class="btn accent" id="savePage">Save page</button> <span class="stat" id="pm"></span></div>
  <div class="card"><b id="ft">Add a button</b><div style="height:10px"></div>
    <label>Button text</label><input type="text" id="lbl" placeholder="e.g. Get 20% off at Acme" />
    <label>Link</label><input type="text" id="url" placeholder="https://…" />
    <label>Campaign (optional — shows its clicks in the campaign report)</label><select id="camp"><option value="">None</option></select>
    <div class="row"><button class="btn accent" id="saveLink">Add button</button><button class="btn" id="cancel" style="display:none">Cancel</button><span class="stat" id="lm"></span></div></div>
  <div id="list"></div>
</div>
<script>
var links = [], editing = 0;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function j(u,m,b){return fetch(u,{method:m||"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.detail||"failed");return d;});});}
document.getElementById("pub").textContent = location.origin + "/links";
function reset(){editing=0;lbl.value="";url.value="";camp.value="";ft.textContent="Add a button";saveLink.textContent="Add button";cancel.style.display="none";}
var lbl=document.getElementById("lbl"),url=document.getElementById("url"),camp=document.getElementById("camp"),ft=document.getElementById("ft"),saveLink=document.getElementById("saveLink"),cancel=document.getElementById("cancel");
function load(){j("/api/bio").then(function(d){
  title.value=(d.page||{}).title||"";handle.value=(d.page||{}).handle||"";text.value=(d.page||{}).text||"";
  camp.innerHTML='<option value="">None</option>'+d.campaigns.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';}).join("");
  links=d.links; var total=links.reduce(function(a,l){return a+l.clicks;},0);
  document.getElementById("list").innerHTML=links.map(function(l,i){
    return '<div class="card link"><div class="body"><b>'+esc(l.label)+'</b>'+(l.active?'':' <span class="stat">(hidden)</span>')+'<div class="stat" style="word-break:break-all">'+esc(l.url)+'</div><div class="stat"><b style="color:#F5F5F7">'+l.clicks+'</b> clicks · '+l.clicks_7d+' in the last 7 days</div></div>'+
      '<div class="row" style="justify-content:flex-end"><button class="btn" data-up="'+i+'">↑</button><button class="btn" data-dn="'+i+'">↓</button><button class="btn" data-ed="'+i+'">Edit</button><button class="btn" data-tg="'+i+'">'+(l.active?'Hide':'Show')+'</button><button class="btn danger" data-del="'+l.id+'">Delete</button></div></div>';
  }).join("")+(links.length?'<div class="stat">Total clicks: '+total+'</div>':'<div class="sub">No buttons yet — add your first one above.</div>');
  var q=function(a,f){document.querySelectorAll("["+a+"]").forEach(function(b){b.onclick=function(){f(b.getAttribute(a));};});};
  q("data-ed",function(i){var l=links[+i];editing=l.id;lbl.value=l.label;url.value=l.url;camp.value=l.campaign_id||"";ft.textContent="Edit button";saveLink.textContent="Save changes";cancel.style.display="";scrollTo(0,0);});
  q("data-tg",function(i){var l=links[+i];j("/api/bio/link","POST",{id:l.id,label:l.label,url:l.url,active:!l.active,campaign_id:l.campaign_id||""}).then(load);});
  q("data-del",function(id){if(confirm("Delete this button and its click history?"))j("/api/bio/link/"+id,"DELETE").then(load);});
  function mv(i,dx){i=+i;var k=i+dx;if(k<0||k>=links.length)return;var ids=links.map(function(l){return l.id;});var t=ids[i];ids[i]=ids[k];ids[k]=t;j("/api/bio/order","PUT",{ids:ids}).then(load);}
  q("data-up",function(i){mv(i,-1);});q("data-dn",function(i){mv(i,1);});
});}
cancel.onclick=reset;
saveLink.onclick=function(){var a=links.find(function(l){return l.id===editing;});
  j("/api/bio/link","POST",{id:editing,label:lbl.value,url:url.value,active:a?a.active:true,campaign_id:camp.value}).then(function(){reset();document.getElementById("lm").textContent="";load();}).catch(function(e){document.getElementById("lm").textContent=e.message;});};
document.getElementById("savePage").onclick=function(){j("/api/bio/page","PUT",{title:title.value,handle:handle.value,text:text.value}).then(function(){document.getElementById("pm").textContent="Saved ✓";}).catch(function(e){document.getElementById("pm").textContent=e.message;});};
var title=document.getElementById("title"),handle=document.getElementById("handle"),text=document.getElementById("text");
load();
</script></body></html>
