<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0A0A0C" /><link rel="icon" href="/static/assets/logo-mark.png" />
<title>Campaign report · WokeVision</title>
<link rel="stylesheet" href="/static/nav.css" />
<style>
  :root { color-scheme: dark; --bg:#0A0A0C; --surface:rgba(255,255,255,0.055); --border:rgba(255,255,255,0.10); --text:#F5F5F7; --faint:rgba(245,245,247,0.5); --accent:#FF2B3C; }
  * { box-sizing: border-box; } html, body { background: var(--bg); color: var(--text); margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding-bottom: 48px; background: radial-gradient(circle at 50% 0%, rgba(255,43,60,0.10), transparent 55%), var(--bg); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 22px 18px 0; } h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.02em; } .sub { color: var(--faint); font-size: 13px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  input, textarea, select { width: 100%; background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font: inherit; font-size: 14.5px; margin-bottom: 10px; }
  label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 5px; }
  .btn { border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text); font: inherit; font-weight: 600; font-size: 13.5px; padding: 9px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.accent { background: var(--accent); border-color: transparent; } .btn.danger { color: #FFB4B4; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; } .pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.1); }
  .ok { background: rgba(48,209,88,.2); color: #6ee79a; } .chg { background: rgba(255,214,10,.18); color: #FFD60A; }
  video { width: 100%; max-width: 260px; border-radius: 12px; background: #000; aspect-ratio: 9/16; object-fit: cover; }
</style></head><body>
<script src="/static/nav.js"></script>
<style>@media print { .wvNav, .noprint, .wvAttn { display: none !important; } body { background: #fff; color: #000; } .card { border-color: #ccc; background: #fff; } .sub { color: #555; } video { display: none; } }</style>
<div class="wrap"><div class="row noprint" style="justify-content:flex-end"><button class="btn accent" onclick="print()">Print / save as PDF</button></div>
<h1 id="t">Report</h1><div class="sub" id="s"></div><div id="items"></div></div>
<script>
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
var id = location.pathname.split("/")[2];
fetch("/api/campaigns/" + id + "/report").then(function (r) { return r.json(); }).then(function (d) {
  var c = d.campaign; document.title = c.name + " report";
  document.getElementById("t").textContent = c.name; var posted = 0;
  d.items.forEach(function (i) { i.posts.forEach(function (p) { if (p.status === "done") posted++; }); });
  document.getElementById("s").textContent = [c.sponsor, d.items.length + " video" + (d.items.length == 1 ? "" : "s"), posted + " posted", new Date().toLocaleDateString()].filter(Boolean).join(" · ");
  document.getElementById("items").innerHTML = d.items.map(function (i) {
    return '<div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:14px">' + (i.video_url ? '<video src="' + esc(i.video_url) + '#t=0.4" preload="metadata" muted playsinline></video>' : "") +
      '<div style="min-width:0"><b>' + esc(i.title) + '</b>' + (i.approval ? ' <span class="pill ' + (i.approval === "approved" ? "ok" : "chg") + '">' + (i.approval === "approved" ? "Approved" : "Changes requested") + '</span>' : "") +
      (i.approval_note ? '<div class="sub">“' + esc(i.approval_note) + '”</div>' : "") + '<div class="sub" style="white-space:pre-wrap">' + esc(i.caption) + '</div>' +
      i.posts.map(function (p) { return '<div style="font-size:13.5px;margin:3px 0">' + esc(p.platform) + ' — ' + esc(p.status) + ' · ' + new Date(p.run_at).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + (p.views != null ? ' · ' + Number(p.views).toLocaleString() + ' views' + (p.likes != null ? ', ' + Number(p.likes).toLocaleString() + ' likes' : '') : '') + (p.url ? ' · <a href="' + esc(p.url) + '" style="color:#ff6b78">view</a>' : "") + '</div>'; }).join("") + '</div></div></div>';
  }).join("") || '<div class="sub">No posts filed under this campaign yet. Open a video in the editor and choose this campaign.</div>';
});
</script>
</body></html>
