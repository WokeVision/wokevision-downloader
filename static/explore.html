<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0A0A0C" /><link rel="icon" href="/static/assets/logo-mark.png" />
<title>Explore · WokeVision</title>
<link rel="stylesheet" href="/static/nav.css" />
<style>
  :root { color-scheme: dark; --bg:#0A0A0C; --surface:rgba(255,255,255,0.055); --border:rgba(255,255,255,0.10); --text:#F5F5F7; --faint:rgba(245,245,247,0.5); --accent:#FF2B3C; }
  * { box-sizing: border-box; } html, body { background: var(--bg); color: var(--text); margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding-bottom: 48px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 18px 0; } h1 { font-size: 26px; margin: 0 0 4px; } .sub { color: var(--faint); font-size: 13px; margin-bottom: 14px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .btn { border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text); font: inherit; font-weight: 600; font-size: 13.5px; padding: 9px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.accent { background: var(--accent); border-color: transparent; } .btn.on { background: rgba(255,255,255,.18); } .btn:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .pv { position: relative; aspect-ratio: 16/10; background: #000 center/cover no-repeat; cursor: pointer; }
  .pv video, .pv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.7); border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.7); border-radius: 6px; padding: 2px 6px; font-size: 11.5px; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .t { font-size: 14.5px; font-weight: 600; line-height: 1.3; } .meta { color: var(--faint); font-size: 12px; }
  .acts { display: flex; gap: 8px; margin-top: auto; } .acts .btn { flex: 1; text-align: center; padding: 10px 8px; }
  .empty { color: var(--faint); padding: 30px 0; text-align: center; }
  .src { font-size: 12px; color: var(--faint); margin-bottom: 14px; line-height: 1.7; } .src b { color: var(--text); font-weight: 600; } .bad { color: #ff8a8a; }
  textarea,input[type=number]{width:100%;background:rgba(0,0,0,.35);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px;font:inherit;font-size:13px;margin:4px 0 10px}textarea{min-height:64px}.card .meta{display:block}.card#cfg{padding:14px;margin-bottom:14px}
  .warn { background: rgba(255,170,0,.1); border: 1px solid rgba(255,170,0,.3); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; }
</style></head><body>
<script src="/static/nav.js"></script>
<div class="wrap">
  <h1>Explore</h1><div class="sub">Clips the app found by itself in the news, Reddit and YouTube trends. Approve one and it goes straight into the editor.</div>
  <div class="bar">
    <button class="btn on" data-s="new">New</button><button class="btn" data-s="approved">Sent to editor</button><button class="btn" data-s="skipped">Skipped</button>
    <span style="flex:1"></span><button class="btn" id="clearNew">Clear list</button><button class="btn" id="tune">Tune sources</button><button class="btn accent" id="scan">Scan now</button>
  </div>
  <div id="cfg" class="card" style="display:none">
    <div class="meta" style="margin-bottom:8px">One item per line (or comma separated). Changes apply on the next scan.</div>
    <label class="meta">Topics / search terms (YouTube + Google News)</label><textarea id="c_keywords"></textarea>
    <label class="meta">YouTube channels to watch (@handle or URL)</label><textarea id="c_channels"></textarea>
    <label class="meta">Public Telegram channels to watch (names)</label><textarea id="c_telegram"></textarea>
    <label class="meta">TikTok hashtags (best effort)</label><textarea id="c_hashtags"></textarea>
    <label class="meta">Subreddits</label><textarea id="c_subreddits"></textarea>
    <label class="meta">Other accounts: full links to TikTok / X / Instagram / Rumble profiles (best effort — those sites often block servers)</label><textarea id="c_handles"></textarea>
    <label class="meta">Extra news RSS feeds</label><textarea id="c_outlets"></textarea>
    <label class="meta">Only send a phone alert for clips scoring at least</label><input id="c_push" type="number" min="0" max="100" style="width:90px">
    <div style="margin-top:10px"><button class="btn accent" id="cfgSave">Save</button> <span class="meta" id="cfgMsg"></span></div>
  </div>
  <div id="warn"></div><div id="radar" class="src"></div><div class="src" id="src"></div>
  <div class="bar" id="plats" style="margin-bottom:10px"></div><div class="grid" id="grid"></div>
</div>
<script>
var status = "new", timer = null, platFilter = "";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmtDur(s){if(!s)return"";s=Math.round(s);return Math.floor(s/60)+":"+("0"+s%60).slice(-2);}
function nfmt(n){n=+n||0;return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"k":""+n;}
function plat(u){var d=(u||'').toLowerCase();return d.indexOf('youtu')>-1?'YouTube':d.indexOf('reddit')>-1?'Reddit':d.indexOf('dailymotion')>-1?'Dailymotion':d.indexOf('tiktok')>-1?'TikTok':d.indexOf('rumble')>-1?'Rumble':d.indexOf('x.com')>-1||d.indexOf('twitter')>-1?'X':d.indexOf('instagram')>-1?'Instagram':'Web';}
function statLine(i){var s=i.stats||{},p=[plat(i.url)];
  if(s.upvotes)p.push(nfmt(s.upvotes)+" upvotes");if(s.per_hour)p.push(nfmt(s.per_hour)+"/hr");if(s.views)p.push(nfmt(s.views)+" views");
  if(s.hot)p.push("🔥 "+s.hot);if(s.trend_traffic)p.push("trend "+s.trend_traffic);if(s.channel)p.push(s.channel);return p.join(" · ");}
function card(i){
  var bg=i.thumb?' style="background-image:url(\''+esc(i.thumb)+'\')"':"";
  var acts=i.status==="new"?'<button class="btn accent" data-a="approve" data-id="'+i.id+'">Send to editor</button><button class="btn" data-a="skip" data-id="'+i.id+'">Skip</button>'
    :i.status==="approved"?'<a class="btn accent" href="/editor#entry='+esc(i.job_id||"")+'">Open in editor</a>'
    :'<button class="btn" data-a="approve" data-id="'+i.id+'">Send to editor anyway</button>';
  return '<div class="card"><div class="pv"'+bg+' data-play="'+i.id+'"><span class="badge">'+Math.round(i.score||0)+' · '+esc(i.topic||i.source)+'</span>'+(i.duration?'<span class="dur">'+fmtDur(i.duration)+'</span>':'')+'<span class="play">▶</span></div>'
    +'<div class="body"><div class="t">'+esc(i.title)+'</div><div class="meta">'+esc(statLine(i))+'</div><div class="meta"><a style="color:inherit" target="_blank" rel="noopener" href="'+esc(i.url)+'">Open original ↗</a></div><div class="acts">'+acts+'</div></div></div>';
}
var ITEMS = {};
function load(){
  fetch("/api/explore?status="+status).then(function(r){return r.json();}).then(function(d){
    ITEMS={};(d.items||[]).forEach(function(i){ITEMS[i.id]=i;});
    var counts={};(d.items||[]).forEach(function(i){var p=plat(i.url);counts[p]=(counts[p]||0)+1;});
    if(platFilter&&!counts[platFilter])platFilter="";
    document.getElementById("plats").innerHTML=Object.keys(counts).length>1?['<button class="btn'+(platFilter?'':' on')+'" data-p="">All '+(d.items||[]).length+'</button>'].concat(Object.keys(counts).sort().map(function(p){return '<button class="btn'+(platFilter===p?' on':'')+'" data-p="'+p+'">'+p+' '+counts[p]+'</button>';})).join(""):"";
    var shown=(d.items||[]).filter(function(i){return !platFilter||plat(i.url)===platFilter;});
    document.getElementById("grid").innerHTML=shown.map(card).join("")||'<div class="empty" style="grid-column:1/-1">'+(status==="new"?"Nothing new yet — press Scan now.":"Nothing here.")+'</div>';
    var ls=d.last_scan||{},src=ls.sources||{},h=[];
    Object.keys(src).forEach(function(k){var s=src[k];h.push(s.ok?'<b>'+k+'</b> '+s.found+' found':(/optional/.test(s.error||'')?'<span style="opacity:.6"><b>'+k+'</b> off</span>':'<span class="bad"><b>'+k+'</b> '+esc(s.error)+'</span>'));});
    document.getElementById("src").innerHTML=ls.running?"Scanning…":(ls.at?"Last scan "+new Date(ls.at).toLocaleString()+" · "+ls.added+" new"+(ls.candidates!=null?" of "+ls.candidates+" candidates":"")+"<br>"+h.join(" · "):"No scan since the server started. It scans automatically every few hours.");
    document.getElementById("radar").innerHTML=(ls.radar&&ls.radar.length)?'<b>Hot right now:</b> '+ls.radar.slice(0,10).map(function(r){return '<span style="display:inline-block;background:rgba(255,255,255,.08);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0" title="'+esc(r.via)+'">🔥 '+esc(r.topic)+'</span>';}).join(""):"";
    var w="";
    if(!d.push)w+='<div class="warn">Phone notifications are off — set NTFY_TOPIC (or Telegram) on the server to get approve / skip alerts.</div>';
    if(!d.timer_configured)w+='<div class="warn">Automatic scans need the outside timer (CRON_SECRET) that also drives scheduled posts — it isn\'t set, so only Scan now works.</div>';
    else if(d.last_tick_seconds_ago==null)w+='<div class="warn">The outside timer hasn\'t pinged the app since it last restarted — automatic scans start with the next ping.</div>';
    else if(d.last_tick_seconds_ago>900)w+='<div class="warn">The outside timer last pinged '+Math.round(d.last_tick_seconds_ago/60)+' min ago — automatic scans are paused until it does.</div>';
    if(ls.at&&!ls.running&&!ls.added&&Object.keys(src).length&&Object.keys(src).every(function(k){return !src[k].ok;}))w+='<div class="warn">Every source failed on the last scan — details in the line below.</div>';
    document.getElementById("warn").innerHTML=w;
    var b=document.getElementById("scan");b.disabled=!!ls.running;b.textContent=ls.running?"Scanning…":"Scan now";
    clearTimeout(timer);if(ls.running)timer=setTimeout(load,4000);
  });
}
document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){status=b.dataset.s;document.querySelectorAll("[data-s]").forEach(function(x){x.classList.toggle("on",x===b);});load();};});
document.getElementById("clearNew").onclick=function(){if(confirm("Remove everything waiting in New? (Sent / skipped stay.)"))fetch("/api/explore/clear",{method:"POST"}).then(load);};
document.getElementById("scan").onclick=function(){this.disabled=true;fetch("/api/explore/scan",{method:"POST"}).then(function(){setTimeout(load,1500);});};
document.getElementById("plats").addEventListener("click",function(e){var b=e.target.closest("[data-p]");if(b){platFilter=b.dataset.p;load();}});
document.getElementById("grid").addEventListener("click",function(e){
  var a=e.target.closest("[data-a]");
  if(a){a.disabled=true;fetch("/api/explore/"+a.dataset.id+"/"+a.dataset.a,{method:"POST"}).then(function(r){return r.json();}).then(function(d){
    load();});return;}
  var p=e.target.closest("[data-play]");
  if(p&&!p.querySelector("video,iframe")&&!p.dataset.busy){var i=ITEMS[p.dataset.play];if(!i)return;
    if(i.preview_url){p.innerHTML='<video src="'+esc(i.preview_url)+'" controls autoplay playsinline loop></video>';return;}
    p.dataset.busy=1;var lab=p.querySelector(".play");lab.textContent="Loading…";lab.style.width="auto";lab.style.padding="0 14px";lab.style.borderRadius="999px";
    var b="/api/explore/"+i.id;fetch(b+"/preview",{method:"POST"});
    var tm=setInterval(function(){fetch(b+"/preview-status").then(function(r){return r.json();}).then(function(s){
      if(s.state==="ready"){clearInterval(tm);p.innerHTML='<video src="'+b+'/preview.mp4" controls autoplay playsinline></video>';}
      else if(s.state==="error"){clearInterval(tm);delete p.dataset.busy;if(i.embed==="youtube"){var id=i.url.split("v=")[1];p.innerHTML='<iframe src="https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';}else lab.textContent="Preview failed — open original";}});},2500);}
});
var CFG_KEYS=["keywords","channels","subreddits","hashtags","telegram","handles","outlets"];
document.getElementById("tune").onclick=function(){var c=document.getElementById("cfg");if(c.style.display==="block"){c.style.display="none";return;}
  fetch("/api/explore/config").then(function(r){return r.json();}).then(function(d){CFG_KEYS.forEach(function(k){document.getElementById("c_"+k).value=(d.config[k]||[]).join("\n");});
    document.getElementById("c_push").value=d.config.push_min_score;c.style.display="block";});};
document.getElementById("cfgSave").onclick=function(){var body={push_min_score:+document.getElementById("c_push").value||35};
  CFG_KEYS.forEach(function(k){body[k]=document.getElementById("c_"+k).value;});
  fetch("/api/explore/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(){document.getElementById("cfgMsg").textContent="Saved ✓";setTimeout(function(){document.getElementById("cfgMsg").textContent="";},2500);});};
load();
</script></body></html>
