<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0A0A0C" /><link rel="icon" href="/static/assets/logo-mark.png" />
<title>Ideas · WokeVision</title>
<link rel="stylesheet" href="/static/nav.css" />
<style>
  :root { color-scheme: dark; --bg:#0A0A0C; --surface:rgba(255,255,255,0.055); --border:rgba(255,255,255,0.10); --text:#F5F5F7; --faint:rgba(245,245,247,0.5); --accent:#FF2B3C; }
  * { box-sizing: border-box; } html, body { background: var(--bg); color: var(--text); margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding-bottom: 48px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 18px 0; } h1 { font-size: 26px; margin: 0 0 4px; } .sub { color: var(--faint); font-size: 13px; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  input { width: 100%; background: rgba(0,0,0,.35); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font: inherit; font-size: 14.5px; margin-bottom: 10px; }
  .btn { border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text); font: inherit; font-weight: 600; font-size: 13.5px; padding: 9px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.accent { background: var(--accent); border-color: transparent; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .u { font-size: 13px; color: var(--faint); word-break: break-all; margin: 4px 0 10px; }
</style></head><body>
<script src="/static/nav.js"></script>
<div class="wrap">
  <h1>Ideas</h1><div class="sub">Save links to clip later. Tap “Edit this” to send one straight into the editor.</div>
  <div class="card"><input id="url" placeholder="Paste a link" /><input id="note" placeholder="Note (optional) — why it's good, the angle…" />
    <button class="btn accent" id="add">Save idea</button></div>
  <div id="list"></div>
</div>
<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function load(){fetch("/api/ideas").then(function(r){return r.json();}).then(function(d){
  document.getElementById("list").innerHTML=(d.items||[]).map(function(i){
    return '<div class="card"><div>'+esc(i.note||"(no note)")+'</div><div class="u">'+esc(i.url)+'</div><div class="row"><a class="btn accent" href="/editor#src='+encodeURIComponent(i.url)+(i.note?'&angle='+encodeURIComponent(i.note):'')+'">Edit this</a><button class="btn" data-del="'+i.id+'">Delete</button></div></div>';
  }).join("")||'<div class="sub">No ideas saved yet.</div>';
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){fetch("/api/ideas/"+b.dataset.del,{method:"DELETE"}).then(load);};});
});}
document.getElementById("add").onclick=function(){var u=document.getElementById("url").value.trim();if(!u)return;
  fetch("/api/ideas",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u,note:document.getElementById("note").value})}).then(function(){document.getElementById("url").value="";document.getElementById("note").value="";load();});};
load();
</script></body></html>
