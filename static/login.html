<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WokeVision Editor -- Sign in</title>
<link rel="icon" href="/static/assets/logo-mark.png" />
<style>
  :root {
    --bg: #0b0b0d;
    --card: #15151a;
    --border: #262630;
    --text: #f2f2f5;
    --text-faint: #8a8a93;
    --red: #ff2d4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1a0a0d, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
  }
  .logo {
    width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 16px;
    display: block;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.sub { color: var(--text-faint); font-size: 13.5px; margin: 0 0 28px; }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .primary { background: var(--red); color: white; }
  .primary:disabled { opacity: 0.6; cursor: default; }
  .secondary { background: transparent; color: var(--text-faint); border: 1px solid var(--border); }
  .toggleLink {
    background: none; border: none; color: var(--text-faint);
    font-size: 13px; text-decoration: underline; cursor: pointer;
    padding: 6px; margin-top: 4px;
  }
  #setupPanel { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); text-align: left; }
  label { font-size: 12.5px; color: var(--text-faint); display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #0f0f13; color: var(--text); font-size: 14px; margin-bottom: 12px;
  }
  #msg { font-size: 13px; margin-top: 14px; min-height: 18px; }
  #msg.error { color: #ff6b7a; }
  #msg.ok { color: #4ade80; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/static/assets/logo-mark.png" alt="" />
    <h1>WokeVision Editor</h1>
    <p class="sub">Sign in with your passkey -- Face ID, Touch ID, or Windows Hello.</p>

    <button class="primary" id="signInBtn" type="button">Sign in with passkey</button>
    <button class="toggleLink" id="showSetupBtn" type="button">Set up a new passkey on this device</button>

    <div id="setupPanel">
      <label for="setupCode">Setup code</label>
      <input type="password" id="setupCode" autocomplete="off" placeholder="Enter the setup code" />
      <button class="secondary" id="registerBtn" type="button">Register this device's passkey</button>
    </div>

    <div id="msg"></div>
  </div>

<script>
  const msg = document.getElementById("msg");
  function showMsg(text, kind) {
    msg.textContent = text;
    msg.className = kind || "";
  }

  function b64urlToBytes(b64url) {
    const pad = "=".repeat((4 - (b64url.length % 4)) % 4);
    const b64 = (b64url + pad).replace(/-/g, "+").replace(/_/g, "/");
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }
  function bytesToB64url(buf) {
    const bytes = new Uint8Array(buf);
    let str = "";
    for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
    return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  document.getElementById("showSetupBtn").addEventListener("click", () => {
    const panel = document.getElementById("setupPanel");
    panel.style.display = panel.style.display === "block" ? "none" : "block";
  });

  document.getElementById("signInBtn").addEventListener("click", async () => {
    showMsg("");
    const btn = document.getElementById("signInBtn");
    btn.disabled = true;
    try {
      const startResp = await fetch("/auth/login/options", { method: "POST" });
      const start = await startResp.json();
      if (!startResp.ok) throw new Error(start.detail || "Couldn't start sign-in.");

      const options = start.options;
      options.challenge = b64urlToBytes(options.challenge);
      (options.allowCredentials || []).forEach((c) => { c.id = b64urlToBytes(c.id); });

      const assertion = await navigator.credentials.get({ publicKey: options });
      const credential = {
        id: assertion.id,
        rawId: bytesToB64url(assertion.rawId),
        type: assertion.type,
        response: {
          authenticatorData: bytesToB64url(assertion.response.authenticatorData),
          clientDataJSON: bytesToB64url(assertion.response.clientDataJSON),
          signature: bytesToB64url(assertion.response.signature),
          userHandle: assertion.response.userHandle ? bytesToB64url(assertion.response.userHandle) : null,
        },
        clientExtensionResults: assertion.getClientExtensionResults ? assertion.getClientExtensionResults() : {},
      };

      const verifyResp = await fetch("/auth/login/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: start.token, credential }),
      });
      const verify = await verifyResp.json();
      if (!verifyResp.ok) throw new Error(verify.detail || "Sign-in failed.");

      showMsg("Signed in.", "ok");
      window.location.href = "/";
    } catch (err) {
      showMsg(err.message || String(err), "error");
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("registerBtn").addEventListener("click", async () => {
    showMsg("");
    const setupCode = document.getElementById("setupCode").value.trim();
    if (!setupCode) { showMsg("Enter the setup code first.", "error"); return; }
    const btn = document.getElementById("registerBtn");
    btn.disabled = true;
    try {
      const startResp = await fetch("/auth/register/options", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ setup_code: setupCode }),
      });
      const start = await startResp.json();
      if (!startResp.ok) throw new Error(start.detail || "Couldn't start setup.");

      const options = start.options;
      options.challenge = b64urlToBytes(options.challenge);
      options.user.id = b64urlToBytes(options.user.id);
      (options.excludeCredentials || []).forEach((c) => { c.id = b64urlToBytes(c.id); });

      const created = await navigator.credentials.create({ publicKey: options });
      const credential = {
        id: created.id,
        rawId: bytesToB64url(created.rawId),
        type: created.type,
        response: {
          attestationObject: bytesToB64url(created.response.attestationObject),
          clientDataJSON: bytesToB64url(created.response.clientDataJSON),
          transports: created.response.getTransports ? created.response.getTransports() : [],
        },
        clientExtensionResults: created.getClientExtensionResults ? created.getClientExtensionResults() : {},
        authenticatorAttachment: created.authenticatorAttachment || null,
      };

      const verifyResp = await fetch("/auth/register/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: start.token, setup_code: setupCode, credential }),
      });
      const verify = await verifyResp.json();
      if (!verifyResp.ok) throw new Error(verify.detail || "Setup failed.");

      showMsg("Passkey registered -- signed in.", "ok");
      window.location.href = "/";
    } catch (err) {
      showMsg(err.message || String(err), "error");
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
