<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0C" />
<link rel="icon" href="/static/assets/logo-mark.png" />
<link rel="apple-touch-icon" href="/static/assets/logo-mark.png" />
<title>Schedule · WokeVision</title>
<link rel="stylesheet" href="/static/nav.css" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0A0A0C; --surface: rgba(255,255,255,0.055); --surface-strong: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.10); --text: #F5F5F7; --text-dim: rgba(245,245,247,0.62);
    --text-faint: rgba(245,245,247,0.38); --accent: #FF2B3C; --accent-dim: rgba(255,43,60,0.16);
    --radius-lg: 20px; --radius-md: 14px; --radius-sm: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(circle at 50% 0%, rgba(255,43,60,0.10), transparent 55%), var(--bg);
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 18px 0; }
  .titleRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 26px; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--text-faint); font-size: 13px; margin-top: 3px; }
  button, input { font-family: inherit; }
  .btn2 { border: 1px solid var(--border); background: rgba(255,255,255,0.04); color: var(--text); font-size: 13.5px; font-weight: 600; padding: 9px 14px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn2:active { background: rgba(255,255,255,0.1); }
  .btn2.accent { background: var(--accent); border-color: transparent; color: #fff; }
  .btn2.danger { color: #FFB4B4; }
  .btn2:disabled { opacity: .5; }

  .banner { font-size: 13px; line-height: 1.45; border-radius: var(--radius-sm); padding: 11px 14px; margin-bottom: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-dim); }
  .banner.warn { background: rgba(255,214,10,0.09); border-color: rgba(255,214,10,0.28); color: #FFE48A; }
  .banner.ok { background: rgba(48,209,88,0.10); border-color: rgba(48,209,88,0.28); color: #8FF0AC; }

  .list { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .dayHead { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; margin: 8px 2px -4px; }
  .post { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; backdrop-filter: blur(20px); }
  .thumb { width: 96px; aspect-ratio: 9/16; border-radius: var(--radius-md); background: #141417; border: 1px solid var(--border); object-fit: cover; display: block; }
  .pbody { min-width: 0; }
  .ptitle { font-size: 14.5px; font-weight: 700; line-height: 1.35; margin: 2px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .phead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 9px 0; border-top: 1px solid var(--border); }
  .row .pl { display: flex; align-items: center; gap: 7px; width: 118px; flex: none; font-size: 13.5px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .row input[type="datetime-local"] { background: rgba(0,0,0,0.35); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 9px 10px; font-size: 14px; color-scheme: dark; min-width: 0; flex: 1 1 190px; max-width: 250px; }
  .row input:focus { outline: none; border-color: var(--accent); }
  .badge { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.08); color: var(--text-dim); white-space: nowrap; }
  .badge.sched { background: rgba(10,132,255,0.18); color: #6CB2FF; }
  .badge.pub { background: rgba(255,214,10,0.14); color: #FFD60A; }
  .badge.done { background: rgba(48,209,88,0.16); color: #4ade80; }
  .badge.err { background: rgba(255,43,60,0.16); color: #FF7A85; }
  .rowActions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .rowActions .btn2 { padding: 7px 12px; font-size: 12.5px; }
  .errtxt { color: #FFB4B4; font-size: 12.5px; flex-basis: 100%; line-height: 1.4; min-width: 0; max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }
  .empty { text-align: center; padding: 56px 16px; color: var(--text-faint); font-size: 14.5px; line-height: 1.6; }
  .allBar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0 2px; }
  .allBar input { background: rgba(0,0,0,0.35); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); padding: 9px 10px; font-size: 14px; color-scheme: dark; }
  details.past { margin-top: 18px; }
  details.past summary { cursor: pointer; color: var(--text-dim); font-size: 14px; font-weight: 600; padding: 8px 2px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #1b1b20; border: 1px solid var(--border); padding: 11px 16px; border-radius: 999px; font-size: 13.5px; display: none; z-index: 60; }

  @media (min-width: 900px) {
    .wrap { max-width: 1480px; padding: 26px 28px 0; }
    .list { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
    .dayHead { grid-column: 1 / -1; }
    h1 { font-size: 30px; }
  }
  @media (min-width: 1320px) { .list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 460px) { .post { grid-template-columns: 72px minmax(0, 1fr); gap: 11px; } .thumb { width: 72px; } .row .pl { width: 100%; } }
  @media (pointer: coarse) { .btn2 { min-height: 40px; } .row input[type="datetime-local"], .allBar input { min-height: 44px; font-size: 16px; } }
  .seg2 { display: inline-flex; gap: 4px; } .seg2 .btn2.active { background: var(--surface-strong); border-color: rgba(255,255,255,.3); }
  .calHead { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; font-weight: 700; font-size: 17px; }
  .calGrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .calDow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); text-align: center; padding: 2px; }
  .calDay { min-height: 96px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 6px; overflow: hidden; }
  .calDay.other { opacity: .35; } .calDay.today { border-color: var(--accent); } .calDay.over { background: var(--accent-dim); }
  .calDay .n { font-size: 11.5px; color: var(--text-faint); margin-bottom: 4px; }
  .chip { display: flex; align-items: center; gap: 5px; font-size: 11px; background: rgba(255,255,255,.08); border-radius: 7px; padding: 3px 5px; margin-bottom: 3px; cursor: grab; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.done { opacity: .55; cursor: default; } .chip.err { background: rgba(255,43,60,.22); }
  @media (max-width: 700px) { .calDay { min-height: 64px; padding: 3px; } .chip span.t { display: none; } }
</style>
</head>
<body>
<script src="/static/nav.js"></script>
<div class="wrap">
  <div class="titleRow">
    <div><h1>Schedule</h1><div class="sub" id="sub">Loading…</div></div>
    <div style="display:flex;gap:8px;align-items:center"><span class="seg2"><button class="btn2 active" id="vList">List</button><button class="btn2" id="vCal">Calendar</button></span><a class="btn2 accent" href="/editor">New post</a></div>
  </div>
  <div id="health"></div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var COLORS = { instagram: "#E1306C", threads: "#A78BFA", youtube: "#FF3B30", tiktok: "#25F4EE", x: "#F5F5F7", facebook: "#4C8BF5" };
  var items = [];
  var view = document.getElementById("view");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function toLocalInput(iso) { var d = new Date(iso); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function dayLabel(iso) { return new Date(iso).toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" }); }
  function timeLabel(iso) { return new Date(iso).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
  function toast(msg) { var t = document.getElementById("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = "none"; }, 2600); }
  function api(method, url, body) {
    return fetch(url, { method: method, headers: body ? { "Content-Type": "application/json" } : undefined, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.detail || "Something went wrong."); return j; }); });
  }

  function tidyErr(e) {
    e = String(e || "");
    var m = e.match(/"message"\s*:\s*"([^"]+)"/);
    if (m) { var head = e.split("{")[0].trim().replace(/:$/, ""); return (head ? head + " — " : "") + m[1]; }
    return e.length > 260 ? e.slice(0, 260) + "…" : e;
  }
  function statusBadge(s) {
    if (s.status === "scheduled") return '<span class="badge sched">Scheduled</span>';
    if (s.status === "publishing") return '<span class="badge pub">Posting now…</span>';
    if (s.status === "done") return '<span class="badge done">Posted</span>';
    if (s.status === "missed") return '<span class="badge err">Missed</span>';
    return '<span class="badge err">Failed</span>';
  }

  function rowHtml(s) {
    var editable = s.status !== "done" && s.status !== "publishing";
    var h = '<div class="row" data-id="' + s.id + '"><span class="pl"><i class="dot" style="background:' + (COLORS[s.platform] || "#888") + '"></i>' + esc(s.label) + '</span>';
    if (editable) h += '<input type="datetime-local" value="' + toLocalInput(s.run_at) + '" data-time="' + s.id + '" />';
    else h += '<span style="font-size:13.5px;color:var(--text-dim)">' + timeLabel(s.run_at) + '</span>';
    h += statusBadge(s);
    h += '<span class="rowActions">';
    if (s.status === "done" && s.post_url) h += '<a class="btn2" href="' + esc(s.post_url) + '" target="_blank" rel="noopener">View post</a>';
    if (s.status === "done") h += '<button class="btn2" data-again="' + s.id + '">Post again…</button>';
    if (editable) h += '<button class="btn2" data-now="' + s.id + '">' + (s.status === "scheduled" ? "Post now" : "Retry now") + '</button><button class="btn2 danger" data-del="' + s.id + '">Remove</button>';
    h += '</span>';
    if (s.error) h += '<div class="errtxt">' + esc(tidyErr(s.error)) + '</div>';
    return h + '</div>';
  }

  function groupPosts(list) {
    var map = {}, order = [];
    list.forEach(function (s) { if (!map[s.history_id]) { map[s.history_id] = []; order.push(s.history_id); } map[s.history_id].push(s); });
    return order.map(function (id) { return map[id]; });
  }

  function postHtml(rows) {
    var f = rows[0];
    var title = f.on_screen_caption || f.title || "Untitled post";
    var anyEditable = rows.some(function (s) { return s.status === "scheduled" || s.status === "error" || s.status === "missed"; });
    var h = '<div class="post"><div>' + (f.video_url ? '<video class="thumb" src="' + esc(f.video_url) + '#t=0.4" preload="metadata" muted playsinline></video>' : '<div class="thumb"></div>') + '</div><div class="pbody">';
    h += '<div class="ptitle">' + esc(title) + '</div><div class="phead"><a class="btn2" href="/editor#entry=' + f.history_id + '">Edit post</a><button class="btn2" data-dup="' + f.history_id + '" title="Make a separate copy you can change and schedule on its own">Duplicate</button></div>';
    if (anyEditable && rows.length > 1) {
      h += '<div class="allBar"><span style="font-size:12.5px;color:var(--text-faint)">All times</span><input type="datetime-local" data-all="' + f.history_id + '" value="' + toLocalInput(rows[0].run_at) + '" /><button class="btn2" data-applyall="' + f.history_id + '">Apply</button></div>';
    }
    h += rows.map(rowHtml).join("") + '</div></div>';
    return h;
  }

  var mode = "list", calMonth = new Date(); calMonth.setDate(1);
  function chipHtml(s) {
    var d = new Date(s.run_at), movable = s.status === "scheduled" || s.status === "error" || s.status === "missed";
    return '<div class="chip' + (s.status === "done" ? " done" : "") + (s.status === "error" || s.status === "missed" ? " err" : "") + '" ' + (movable ? 'draggable="true" data-sid="' + s.id + '"' : "") +
      ' title="' + esc((s.on_screen_caption || s.title || "") + " — " + s.label) + '"><i class="dot" style="background:' + (COLORS[s.platform] || "#888") + '"></i><span class="t">' + pad(d.getHours()) + ":" + pad(d.getMinutes()) + '</span> ' + esc(s.label) + '</div>';
  }
  function renderCal() {
    var y = calMonth.getFullYear(), m = calMonth.getMonth(), first = new Date(y, m, 1), start = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var h = '<div class="calHead"><button class="btn2" id="cPrev">&larr;</button><span>' + calMonth.toLocaleDateString([], { month: "long", year: "numeric" }) + '</span><button class="btn2" id="cNext">&rarr;</button></div><div class="calGrid">';
    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].forEach(function (d) { h += '<div class="calDow">' + d + '</div>'; });
    for (var i = 0; i < 42; i++) {
      var d = new Date(start); d.setDate(start.getDate() + i);
      var key = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      var day = items.filter(function (s) { var x = new Date(s.run_at); return x.getFullYear() === d.getFullYear() && x.getMonth() === d.getMonth() && x.getDate() === d.getDate(); }).sort(function (a, b) { return a.run_at < b.run_at ? -1 : 1; });
      h += '<div class="calDay' + (d.getMonth() !== m ? " other" : "") + (d.getTime() === today.getTime() ? " today" : "") + '" data-day="' + key + '"><div class="n">' + d.getDate() + '</div>' + day.map(chipHtml).join("") + '</div>';
    }
    view.innerHTML = h + '</div><div class="sub" style="margin-top:10px">Drag a post to another day to reschedule it (the time of day stays the same).</div>';
    document.getElementById("cPrev").onclick = function () { calMonth.setMonth(calMonth.getMonth() - 1); renderCal(); };
    document.getElementById("cNext").onclick = function () { calMonth.setMonth(calMonth.getMonth() + 1); renderCal(); };
    var drag = null;
    view.querySelectorAll(".chip[draggable]").forEach(function (c) { c.addEventListener("dragstart", function (e) { drag = c.dataset.sid; e.dataTransfer.setData("text/plain", drag); }); });
    view.querySelectorAll(".calDay").forEach(function (c) {
      c.addEventListener("dragover", function (e) { e.preventDefault(); c.classList.add("over"); });
      c.addEventListener("dragleave", function () { c.classList.remove("over"); });
      c.addEventListener("drop", function (e) {
        e.preventDefault(); c.classList.remove("over");
        var it = items.filter(function (s) { return s.id === drag; })[0]; if (!it) return;
        var p = c.dataset.day.split("-"), when = new Date(it.run_at); when.setFullYear(+p[0], +p[1] - 1, +p[2]);
        if (when.getTime() < Date.now()) { toast("Pick a time in the future."); return; }
        api("PUT", "/api/schedule/" + it.id, { run_at: when.toISOString() }).then(function () { toast("Moved"); return load(); }).catch(function (err) { toast(err.message); });
      });
    });
  }
  function render() {
    document.getElementById("vList").classList.toggle("active", mode === "list"); document.getElementById("vCal").classList.toggle("active", mode === "cal");
    if (mode === "cal") { document.getElementById("sub").textContent = items.filter(function (s) { return s.status !== "done"; }).length + " queued"; return renderCal(); }
    var upcoming = items.filter(function (s) { return s.status !== "done"; });
    var past = items.filter(function (s) { return s.status === "done"; }).sort(function (a, b) { return a.run_at < b.run_at ? 1 : -1; });
    document.getElementById("sub").textContent = upcoming.length ? upcoming.length + " post" + (upcoming.length === 1 ? "" : "s") + " queued" : "Nothing queued";
    var h = "";
    var bad = upcoming.filter(function (s) { return s.status === "error" || s.status === "missed"; });
    if (bad.length) {
      h += '<div class="banner warn"><b>' + bad.length + ' post' + (bad.length === 1 ? "" : "s") + ' need' + (bad.length === 1 ? "s" : "") + ' attention</b><br>' +
        bad.map(function (s) { return esc(s.label) + " — " + esc(s.on_screen_caption || s.title || "Untitled") + ": " + esc(tidyErr(s.error || (s.status === "missed" ? "Missed" : "Failed"))); }).join("<br>") +
        '<br><span style="opacity:.8">Each platform is separate: use <b>Retry now</b> on just the one that failed.</span></div>';
    }
    if (!upcoming.length) {
      h += '<div class="empty">Nothing is scheduled.<br>Finish a post in the Video Editor, switch the bottom panel to <b>Schedule</b>, pick a time and it will appear here.<br><br><a class="btn2 accent" href="/editor">Open the Video Editor</a></div>';
    } else {
      var groups = groupPosts(upcoming).sort(function (a, b) { return a[0].run_at < b[0].run_at ? -1 : 1; });
      var lastDay = "";
      h += '<div class="list">';
      groups.forEach(function (g) {
        var d = dayLabel(g[0].run_at);
        if (d !== lastDay) { h += '<div class="dayHead">' + esc(d) + '</div>'; lastDay = d; }
        h += postHtml(g);
      });
      h += '</div>';
    }
    if (past.length) {
      h += '<details class="past"><summary>Posted (' + past.length + ')</summary><div class="list" style="margin-top:8px">' + groupPosts(past).map(postHtml).join("") + '</div></details>';
    }
    view.innerHTML = h;
  }

  document.getElementById("vList").onclick = function () { mode = "list"; render(); };
  document.getElementById("vCal").onclick = function () { mode = "cal"; render(); };
  function load() {
    return api("GET", "/api/schedule").then(function (j) { items = j.items || []; render(); })
      .catch(function (e) { view.innerHTML = '<div class="banner warn">Couldn\'t load the schedule: ' + esc(e.message) + '</div>'; });
  }

  function health() {
    api("GET", "/api/schedule-health").then(function (j) {
      var el = document.getElementById("health");
      var queued = items.some(function (s) { return s.status === "scheduled"; });
      if (!j.timer_configured) {
        el.innerHTML = '<div class="banner warn"><b>Timer not set up yet.</b> The free server sleeps when idle, so scheduled posts only go out if the app happens to be awake. Setting the outside timer (a one-minute ping) makes them reliable.</div>';
      } else if (j.last_tick_seconds_ago == null) {
        el.innerHTML = queued ? '<div class="banner">Timer key is set. Waiting for the first ping from the outside timer…</div>' : "";
      } else if (j.last_tick_seconds_ago > 300) {
        el.innerHTML = '<div class="banner warn"><b>The timer hasn\'t pinged for ' + Math.round(j.last_tick_seconds_ago / 60) + ' minutes.</b> Check the outside timer is still running, or scheduled posts may be late.</div>';
      } else {
        el.innerHTML = '<div class="banner ok">Timer connected · last ping ' + j.last_tick_seconds_ago + 's ago</div>';
      }
    }).catch(function () {});
  }

  view.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.time) {
      var d = new Date(t.value);
      if (isNaN(d) || d.getTime() < Date.now() - 60000) { toast("Pick a time in the future."); return load(); }
      api("PUT", "/api/schedule/" + t.dataset.time, { run_at: d.toISOString() }).then(function () { toast("Time updated"); return load(); }).catch(function (er) { toast(er.message); load(); });
    }
  });
  view.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var ds = b.dataset;
    if (ds.del) {
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Tap to confirm"; setTimeout(function () { b.dataset.armed = ""; b.textContent = "Remove"; }, 3000); return; }
      api("DELETE", "/api/schedule/" + ds.del).then(function () { toast("Removed from schedule"); return load(); }).catch(function (er) { toast(er.message); });
    } else if (ds.now) {
      if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "Tap to confirm"; setTimeout(function () { b.dataset.armed = ""; b.textContent = "Post now"; }, 3000); return; }
      b.disabled = true;
      api("POST", "/api/schedule/" + ds.now + "/post-now").then(function () { toast("Posting now…"); setTimeout(load, 4000); }).catch(function (er) { toast(er.message); b.disabled = false; });
    } else if (ds.dup) {
      b.disabled = true;
      api("POST", "/history/" + ds.dup + "/duplicate").then(function (j) { location.href = "/editor#entry=" + j.id; }).catch(function (er) { toast(er.message); b.disabled = false; });
    } else if (ds.again) {
      var row = b.closest(".row"), ex = row.querySelector(".againBox");
      if (ex) { ex.remove(); return; }
      var d0 = new Date(Date.now() + 24 * 3600 * 1000);
      var box = document.createElement("div"); box.className = "againBox allBar"; box.style.flexBasis = "100%";
      box.innerHTML = '<input type="datetime-local" value="' + toLocalInput(d0.toISOString()) + '" /><button class="btn2 accent" data-again-ok="' + ds.again + '">Schedule again</button>';
      row.appendChild(box);
    } else if (ds.againOk) {
      var v = b.parentNode.querySelector("input").value, d2 = new Date(v);
      if (isNaN(d2) || d2.getTime() < Date.now() - 60000) { toast("Pick a time in the future."); return; }
      api("POST", "/api/schedule/" + ds.againOk + "/repost", { run_at: d2.toISOString() }).then(function () { toast("Scheduled again"); return load(); }).catch(function (er) { toast(er.message); });
    } else if (ds.applyall) {
      var inp = view.querySelector('input[data-all="' + ds.applyall + '"]');
      var d = new Date(inp.value);
      if (isNaN(d) || d.getTime() < Date.now() - 60000) { toast("Pick a time in the future."); return; }
      var rows = items.filter(function (s) { return s.history_id === ds.applyall && (s.status === "scheduled" || s.status === "error" || s.status === "missed"); });
      Promise.all(rows.map(function (s) { return api("PUT", "/api/schedule/" + s.id, { run_at: d.toISOString() }); }))
        .then(function () { toast("All times updated"); return load(); }).catch(function (er) { toast(er.message); load(); });
    }
  });

  load().then(health);
  setInterval(function () { var a = document.activeElement; if (a && a.tagName === "INPUT") return; load().then(health); }, 30000);
})();
</script>
</body>
</html>
